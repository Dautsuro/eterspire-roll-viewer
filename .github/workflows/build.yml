name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest -q
      - name: Build the exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name EterspireRollViewer
          --add-data "roll_viewer\data;roll_viewer\data"
          --add-data "roll_viewer\assets;roll_viewer\assets"
          --icon roll_viewer\assets\icon.ico --hidden-import pystray._win32 --collect-submodules winrt
          run.py
      - uses: actions/upload-artifact@v4
        with:
          name: EterspireRollViewer
          path: dist/EterspireRollViewer.exe
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EterspireRollViewer.exe
